[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanic-shop-manager"
version = "0.1.0"
description = "Offline-first desktop shop management application for a mechanic shop"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Mechanic Shop Manager" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "httpx>=0.27,<1.0",
    "PySide6>=6.7,<7.0",
    "reportlab>=4.0,<5.0",
    "python-multipart>=0.0.9,<0.1",
    "opencv-python-headless>=4.10,<5.0",
    "pyzbar>=0.1.9,<0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pytest-cov>=5.0,<6.0",
    "respx>=0.21,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "python-barcode>=0.15,<1.0",
]

[project.scripts]
mechanic-shop-server = "backend.app.main:run_server"

[project.gui-scripts]
mechanic-shop = "frontend.mechanic_shop.main:main"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# PEP 695 generic syntax isn't used for classes that stay compatible with
# Pydantic generic models (e.g. PaginatedResponse) and typing.Generic-based
# repository bases -- both intentionally keep the classic Generic[T] form.
# B008: QAbstractTableModel.rowCount/columnCount(parent=QModelIndex()) is
# Qt's own C++ API signature, mirrored as-is on the Python side -- not a
# mutable-default-argument bug.
ignore = ["UP046", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
