services:
  backend:
    build: .
    user: "1000:1000" # host UID:GID (casey) -- keeps bind-mounted files host-owned, not root
    ports:
      - "8756:8756"
    volumes:
      - ./data/app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8756/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8756/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
